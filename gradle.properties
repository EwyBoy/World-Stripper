# Every property used in fabric.mod.json or neoforge.mods.toml must be in the expandProps map
# in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=6.0.0
group=com.ewyboy.worldstripper
java_version=25

# Mod
mod_id=worldstripper
mod_name=WorldStripper
mod_display_name=World Stripper
mod_authors=Ewy
mod_description=Strip the world of all its blocks
mod_license=MIT
mod_page_url=https://www.curseforge.com/minecraft/mc-mods/world-stripper
mod_issues_url=https://github.com/EwyBoy/World-Stripper/issues
mod_git_url=https://github.com/EwyBoy/World-Stripper

# Common
minecraft_version=26.3
# The vanilla version the common project compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
fabric_minecraft_version_range=~26.3
neoforge_minecraft_version_range=[26.3,26.4)

# Fabric
fabric_version=0.165.0+26.3
fabric_loader_version=0.20.1

# NeoForge
neoforge_version=26.3.0.99
neoforge_version_range=[26.3.0.99,)
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
