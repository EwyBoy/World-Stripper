plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Common code only sees vanilla Minecraft, so anything loader specific has to live in the loader modules.
neoForge {
    neoFormVersion = neo_form_version
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
