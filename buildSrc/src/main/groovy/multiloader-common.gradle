plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

// Same file names as the 1.21 line: worldstripper-<minecraft>-<version>-<loader>.jar
tasks.named('jar', Jar) { archiveFileName = "${mod_id}-${minecraft_version}-${version}-${project.name}.jar" }
tasks.named('sourcesJar', Jar) { archiveFileName = "${mod_id}-${minecraft_version}-${version}-${project.name}-sources.jar" }

sourcesJar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}_${mod_id}" }
    }
}

jar {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}_${mod_id}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'mod_version'                     : version,
            'minecraft_version'               : minecraft_version,
            'fabric_minecraft_version_range'  : fabric_minecraft_version_range,
            'neoforge_minecraft_version_range': neoforge_minecraft_version_range,
            'fabric_version'                  : fabric_version,
            'fabric_loader_version'           : fabric_loader_version,
            'neoforge_version'                : neoforge_version,
            'neoforge_version_range'          : neoforge_version_range,
            'neoforge_loader_version_range'   : neoforge_loader_version_range,
            'java_version'                    : java_version,
            'mod_id'                          : mod_id,
            'mod_name'                        : mod_name,
            'mod_display_name'                : mod_display_name,
            'mod_authors'                     : mod_authors,
            'mod_description'                 : mod_description,
            'mod_license'                     : mod_license,
            'mod_page_url'                    : mod_page_url,
            'mod_issues_url'                  : mod_issues_url,
            'mod_git_url'                     : mod_git_url
    ]

    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
